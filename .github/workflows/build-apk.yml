name: Build offline Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Verify driving-rule calculations
        run: npm run test:rules

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Build installable release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk TruckHoursOffline.apk

      - name: Read app version
        id: version
        run: node -p "'value=' + require('./app.json').expo.version" >> "$GITHUB_OUTPUT"

      - name: Publish installable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: Truck Hours ${{ steps.version.outputs.value }}
          files: TruckHoursOffline.apk
          generate_release_notes: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TruckHoursOffline-APK
          path: TruckHoursOffline.apk
          if-no-files-found: error
